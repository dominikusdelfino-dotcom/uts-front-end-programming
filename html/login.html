<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#363d2b">
    <title>
      Masuk Demo — OFFBEAT
    </title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
      <script src="../js/script.js" defer></script>
  </head>
  <body>
    <a href="#main" class="skip">
      Langsung ke konten
    </a>
    <div id="site-header">
    </div>
    <noscript>
      <div class="no-js">
        Aktifkan JavaScript untuk katalog dan fitur belanja.
        <a href="../html/index.html">
          Beranda
        </a>
        ·
        <a href="../html/about.html">
          Tentang kami
        </a>
      </div>
    </noscript>
    <main id="main">
      <div class="container content-bottom">
        <div class="narrow">
          <div class="page-head">
            <div class="breadcrumb">
              <a href="../html/index.html">
                Home
              </a>
               /  Welcome Back.
            </div>
            <span class="eyebrow">
              YOUR OFFBEAT ACCOUNT
            </span>
            <h1>
              WELCOME BACK.
            </h1>
            <p>
              Masuk ke profil demo yang sudah dibuat di browser ini.
            </p>
          </div>
          <div class="panel">
            <div class="notice">
              Demo tanpa kata sandi. Nama dan email disimpan secara lokal; tidak ada autentikasi server.
            </div>
            <form id="login-form" class="stack">
              <div class="field">
                <label for="email">
                  Email profil demo
                </label>
                <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" placeholder="contoh@kampus.test">
              </div>
              <button class="btn acid full" type="submit">
                MASUK KE DEMO ↗
              </button>
              <p id="login-status" class="form-status" role="status">
              </p>
            </form>
            <div class="link-row">
              <span>
                Belum punya profil?
              </span>
              <a href="../html/register.html">
                Buat profil ↗
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="site-footer">
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    </div>
  </body>
</html>
