<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#363d2b">
    <title>
      Daftar Profil Demo — OFFBEAT
    </title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
      <script src="../js/script.js" defer></script>
  </head>
  <body>
    <a href="#main" class="skip">
      Langsung ke konten
    </a>
    <div id="site-header">
    </div>
    <noscript>
      <div class="no-js">
        Aktifkan JavaScript untuk katalog dan fitur belanja.
        <a href="../html/index.html">
          Beranda
        </a>
        ·
        <a href="../html/about.html">
          Tentang kami
        </a>
      </div>
    </noscript>
    <main id="main">
      <div class="container content-bottom">
        <div class="narrow">
          <div class="page-head">
            <div class="breadcrumb">
              <a href="../html/index.html">
                Home
              </a>
               /  Join The Frequency.
            </div>
            <span class="eyebrow">
              CREATE A DEMO PROFILE
            </span>
            <h1>
              JOIN THE FREQUENCY.
            </h1>
            <p>
              Satu profil sederhana untuk mencoba pengalaman akun.
            </p>
          </div>
          <div class="panel">
            <div class="notice">
              Gunakan nama dan email contoh. Hanya satu profil demo disimpan per browser, tanpa kata sandi.
            </div>
            <form id="register-form" class="stack">
              <div class="field">
                <label for="name">
                  Nama
                </label>
                <input id="name" name="name" type="text" required maxlength="60" autocomplete="name" placeholder="Nama contoh">
              </div>
              <div class="field">
                <label for="email">
                  Email contoh
                </label>
                <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" placeholder="contoh@kampus.test">
              </div>
              <label class="check">
                <input type="checkbox" required>
                <span>
                  Saya memahami bahwa profil ini adalah simulasi dan disimpan di browser.
                </span>
              </label>
              <button class="btn acid full" type="submit">
                BUAT PROFIL DEMO ↗
              </button>
              <p class="form-status" id="register-status" role="status">
              </p>
            </form>
            <div class="link-row">
              <span>
                Sudah punya profil?
              </span>
              <a href="../html/login.html">
                Masuk ↗
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="site-footer">
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    </div>
  </body>
</html>
