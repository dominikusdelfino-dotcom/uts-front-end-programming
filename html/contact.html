<!doctype html>
<!-- Penanggung jawab: Juan | Halaman: Hubungi Kami -->
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Hubungi Kami OFFBEAT — proyek toko streetwear dengan HTML, CSS, dan JavaScript murni.">
        <meta name="theme-color" content="#363d2b">
        <title>
        Hubungi Kami — OFFBEAT
        </title>
        <link rel="icon" href="../images/favicon.png" type="image/png">
        <link rel="stylesheet" href="../css/style.css">
        <script src="../js/script.js" defer></script>
    </head>
    <body data-owner="Juan">
        <a href="#main" class="skip">Langsung ke konten</a>
        <div id="site-header">
        </div>
        <noscript>
            <div class="no-js">
                Aktifkan JavaScript untuk katalog dan fitur belanja.
                <a href="../html/index.html">Beranda</a>
                ·
                <a href="../html/about.html">Tentang kami</a>
            </div>
        </noscript>
        <main id="main">
            <div class="container content-bottom">
                <div class="page-head">
                    <div class="breadcrumb">
                        <a href="../html/index.html">
                        Home
                        </a>
                        /  Let'S Talk.
                    </div>
                    <span class="eyebrow">CONTACT / SAY HELLO</span>
                    <h1>LET'S TALK.</h1>
                    <p>Punya pertanyaan atau ide? Kami siap mendengar.</p>
                </div>
                <div class="two-col">
                    <div class="panel">
                        <h2>DROP US A LINE.</h2>
                        <form id="contact-form" class="form-grid">
                        <div class="field">
                            <label for="name">Nama kamu
                            </label>
                            <input id="name" name="name" type="text" required maxlength="60" autocomplete="name">
                        </div>
                        <div class="field">
                            <label for="email">
                            Email
                            </label>
                            <input id="email" name="email" type="email" required maxlength="120" autocomplete="email">
                        </div>
                        <div class="field wide">
                            <label for="topic">
                            Topik
                            </label>
                            <select id="topic" name="topic" required>
                            <option value="">
                                Pilih topik
                            </option>
                            <option>
                                Produk dan ukuran
                            </option>
                            <option>
                                Pesanan demo
                            </option>
                            <option>
                                Kolaborasi
                            </option>
                            <option>
                                Pertanyaan lainnya
                            </option>
                            </select>
                        </div>
                        <div class="field wide">
                            <label for="message">
                            Pesan
                            </label>
                            <textarea id="message" name="message" required minlength="10" maxlength="1500" placeholder="Ceritakan sedikit lebih detail…">
                            </textarea>
                        </div>
                        <div class="field wide">
                            <button class="btn acid" type="submit">
                            KIRIM PESAN DEMO ↗
                            </button>
                            <p class="form-status" id="contact-status" role="status">
                            </p>
                        </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
